openapi: 3.0.4
info:
  title: Energy Prices
  description: >-
    Energy Prices returns the latest daily closing spot price for WTI and Brent
    crude, Henry Hub natural gas and US gasoline, diesel, heating oil, propane
    and jet fuel benchmarks, with the previous close, the daily change and the
    52-week high and low. Convert to barrels, gallons, liters, MMBtu, therms or
    MWh, ask for several benchmarks at once, or pull a daily or weekly history.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/energyprices:
    get:
      summary: Energy Prices
      description: >-
        Get the latest or a historical daily spot close for one or more energy
        benchmarks, with change, 52-week range and optional history.
      operationId: energyprices
      parameters:
        - name: benchmark
          in: query
          schema:
            type: string
          required: false
          description: >-
            Benchmark to price, or a comma-separated list (paid plans), or all.
            Defaults to wti.
          example: wti
        - name: unit
          in: query
          schema:
            type: string
          required: false
          description: >-
            Unit to price per: barrel, gallon or liter for crude and refined
            products; mmbtu, therm or mwh for natural gas. Defaults to each
            benchmark's published unit.
          example: gallon
        - name: date
          in: query
          schema:
            type: string
          required: false
          description: >-
            Date to look up (YYYY-MM-DD). Returns the close on that day, or the
            latest trading day before it. Omit for the latest close.
          example: '2025-06-13'
        - name: history
          in: query
          schema:
            type: string
          required: false
          description: >-
            Include a price series ending at the returned date: daily closes or
            the last close of each week.
          example: daily
        - name: days
          in: query
          schema:
            type: integer
          required: false
          description: >-
            Calendar days of history to include (1-3650). Daily history allows
            up to 366. Defaults to 30.
          example: 30
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  count: 1
                  date: '2026-11-11'
                  prices:
                    - benchmark: wti
                      name: WTI Crude Oil
                      product: crude oil
                      location: Cushing, OK
                      currency: USD
                      unit: barrel
                      nativeUnit: barrel
                      price: 89.62
                      date: '2026-11-11'
                      previousClose: 89.62
                      previousDate: '2026-11-10'
                      change: 0
                      changePercent: 0
                      changeDirection: unchanged
                      high52w: 114.58
                      high52wDate: '2026-04-07'
                      low52w: 55.44
                      low52wDate: '2025-12-16'
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
